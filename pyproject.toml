[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temperance"
version = "2024.5.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "bilby",
  "matplotlib",
  "seaborn",
  "astropy",
  "sympy",
  "tqdm"
]
requires-python = ">=3.8"

authors = [
  {name = "Isaac Legred", email = "ilegred@caltech.edu"}
]
maintainers = [
  {name = "Isaac Legred", email = "ilegred@caltech.edu"}
]
description = "An interface for astrophysical data and inference of the nuclear EoS"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]


[project.optional-dependencies]
jax = ["jax"]
ml = ["torch", "pyro-ppl"]
lal = ["lalsuite"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/isaaclegred/temperance"





